nfs:
  persistence:
    enabled: true
    size: 2Gi
    storageClass: standard
  storageClass:
    create: true
    name: "nfs-rwx"
    defaultClass: false
    mountOptions:
      - vers=4.1
      - retrans=2
      - timeo=30

postgresql:
  volumePermissions:
    enabled: true
  global:
    postgresql:
      auth:
        username: "airflow"
        database: "airflow"
        existingSecret: "airflow-postgresql-credentials"
    persistence:
      enabled: true
      size: 1Gi
      storageClass: "nfs-rwx"

airflow:
  images:
    airflow:
      repository: conexaeksairflowdev
      tag: dev
      pullPolicy: IfNotPresent
  executor: "KubernetesExecutor"
  postgresql:
    enabled: false
  workers:
    replicas: 0
  redis:
    enabled: false
  logs:
    persistence:
      enabled: true
      size: 1Gi
      storageClassName: "nfs-rwx"
  data:
    metadataSecretName: "airflow-credentials"
  config:
    core:
      load_examples: "False"
  migrateDatabaseJob:
    useHelmHooks: false
    applyCustomEnv: false
    jobAnnotations:
      "argocd.argoproj.io/hook": Sync
  createUserJob:
    useHelmHooks: false
    applyCustomEnv: false
  dags:
    persistence:
      enabled: true
      size: 1Gi
      storageClassName: "nfs-rwx"
    gitSync:
      enabled: true
      repo: "https://github.com/conexasaude/airflow.git"
      branch: "dev"
      rev: "HEAD"
      depth: 1
      wait: 60
      maxFailures: 3
      subPath: "dags_eks"
      credentialsSecret: "airflow-credentials"
  dagProcessor:
    extraContainers:
      - name: dbt-parse
        image: "{{ .Values.airflow.images.airflow.repository }}:{{ .Values.airflow.images.airflow.tag }}"
        command: ["bash", "-c"]
        args:
          - |
            REPO_PATH="/opt/airflow/dags/repo/dbt/lakehouse"
            LAST_HASH=""
            while true; do
              if [ -d "$REPO_PATH" ]; then
                CUR_HASH=$(git -C "$REPO_PATH" rev-parse HEAD 2>/dev/null)
                if [ "$CUR_HASH" != "$LAST_HASH" ]; then
                  echo "Mudança detectada, rodando dbt parse..."
                  dbt parse --project-dir "$REPO_PATH"
                  LAST_HASH="$CUR_HASH"
                fi
              fi
              sleep 30
            done
        volumeMounts:
          - name: dags
            mountPath: /opt/airflow/dags