nfs:
  persistence:
    enabled: true
    storageClass: standard
    size: 2Gi
  storageClass:
    name: "nfs-rwx"
    accessMode: ReadWriteMany
    reclaimPolicy: Retain
    defaultClass: false
    mountOptions:
      - vers=4.1
      - retrans=2

postgresql:
  global:
    postgresql:
      postgresPassword: "12345678"
      username: "airflow"
      password: "12345678"
      database: "airflow"

airflow:
  executor: "KubernetesExecutor"
  postgresql:
    enabled: false
  workers:
    replicas: 0
  logs:
    persistence:
      enabled: true
      size: 1Gi
      storageClassName: "nfs-rwx"
  data:
    metadataConnection:
      user: airflow
      pass: "12345678"
      protocol: "postgresql"
      db: "airflow"
      port: 5432
      host: "airflow-postgresql.airflow.svc.cluster.local"
  config:
    core:
      load_examples: "False"
  dags:
    gitSync:
      enabled: true
      repo: "https://github.com/conexasaude/airflow.git"
      branch: "main"
      rev: "HEAD"
      depth: 1
      wait: 60
      maxFailures: 3
      subPath: "dags_eks"
      credentialsSecret: "airflow-git-secret"