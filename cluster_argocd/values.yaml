nfs:
  persistence:
    enabled: true
    size: 2Gi
    storageClass: standard
  storageClass:
    create: true
    name: "nfs-rwx"
    defaultClass: false
    mountOptions:
      - vers=4.1
      - retrans=2
      - timeo=30

postgresql:
  volumePermissions:
    enabled: true
  global:
    auth:
      username: "airflow"
      database: "airflow"
      existingSecret: "airflow-postgresql-credentials"
    postgresql:
      username: "airflow"
      database: "airflow"
      existingSecret: "airflow-postgresql-credentials"
    persistence:
      enabled: true
      size: 1Gi
      storageClass: "nfs-rwx"

airflow:
  executor: "KubernetesExecutor"
  postgresql:
    enabled: false
  workers:
    replicas: 0
  logs:
    persistence:
      enabled: true
      size: 1Gi
      storageClassName: "nfs-rwx"
  data:
    metadataSecretName: "airflow-credentials"
  config:
    core:
      load_examples: "False"
  dags:
    gitSync:
      enabled: true
      repo: "https://github.com/conexasaude/airflow.git"
      branch: "main"
      rev: "HEAD"
      depth: 1
      wait: 60
      maxFailures: 3
      subPath: "dags_eks"
      credentialsSecret: "airflow-credentials"