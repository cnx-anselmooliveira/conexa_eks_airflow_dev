airflow:
  enabled: true
  images:
    airflow:
      repository: 024848458609.dkr.ecr.sa-east-1.amazonaws.com/conexasaude/airflow-dbt-hmg
      tag: homolog
      pullPolicy: Always
  executor: "KubernetesExecutor"
  postgresql:
    enabled: false
  workers:
    replicas: 0
  redis:
    enabled: false
  data:
    metadataSecretName: "conexa-external-secrets-airflow-hml"
  fernetKeySecretName: "conexa-external-secrets-airflow-fernet-key-hml"
  apiSecretKeySecretName: "conexa-external-secrets-airflow-api-secret-key-hml"
  apiServer:
    resources:
      requests:
        cpu: "2"
        memory: "2Gi"
      limits:
        cpu: "4"
        memory: "4Gi"
    startupProbe:
      failureThreshold: 20
      periodSeconds: 10
  scheduler:
    startupProbe:
      failureThreshold: 20
      periodSeconds: 10
    resources:
      requests:
        cpu: "1"
        memory: "1Gi"
      limits:
        cpu: "2"
        memory: "2Gi"
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: kubernetes.io/arch
            operator: In
            values:
            - amd64
  extraEnv: |
    - name: MY_POD_IP
      valueFrom:
        fieldRef:
          fieldPath: status.podIP
    - name: AIRFLOW__CORE__HOSTNAME_CALLABLE
      value: "k8s_hostname.get_pod_ip"
  config:
    core:
      load_examples: "False"
  migrateDatabaseJob:
    useHelmHooks: false
    applyCustomEnv: false
    jobAnnotations:
      "argocd.argoproj.io/hook": Sync
  createUserJob:
    useHelmHooks: false
    applyCustomEnv: false
  dags:
    gitSync:
      enabled: true
      repo: "https://github.com/conexasaude/airflow.git"
      branch: "homologacao"
      rev: "HEAD"
      depth: 1
      wait: 60
      maxFailures: 3
      subPath: "dags_eks"
      credentialsSecret: "conexa-external-secrets-airflow-git-hml"
  dagProcessor:
    resources:
      requests:
        cpu: "1"
        memory: "1Gi"
      limits:
        cpu: "2"
        memory: "2Gi"
    extraContainers:
      - name: dbt-parse
        image: "{{ .Values.images.airflow.repository }}:{{ .Values.images.airflow.tag }}"
        command: ["bash", "-c"]
        args:
          - |
            REPO_PATH="/opt/airflow/dags/repo/dbt/lakehouse"
            WORK_DIR="/opt/airflow/dags/dbt-workdir"
            git config --global --add safe.directory "*"
            LAST_HASH=""
            while true; do
              if [ -d "$REPO_PATH" ]; then
                CUR_HASH=$(git -C "$REPO_PATH" rev-parse HEAD 2>/dev/null)
                if [ "$CUR_HASH" != "$LAST_HASH" ]; then
                  echo "Mudança detectada, rodando dbt deps + parse..."
                  rm -rf "$WORK_DIR"
                  mkdir -p "$WORK_DIR"
                  cp -r "$REPO_PATH"/. "$WORK_DIR"/
                  dbt deps --project-dir "$WORK_DIR"
                  dbt parse --project-dir "$WORK_DIR"
                  LAST_HASH="$CUR_HASH"
                fi
              fi
              sleep 30
            done
        volumeMounts:
          - name: dags
            mountPath: /opt/airflow/dags